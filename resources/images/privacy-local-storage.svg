<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none" role="img">
  <!--
    "Your data stays on your computer", shown as the thing itself: a folder on
    a local disk, with a real path, real file sizes, and a status bar.

    The previous version was the stock security-illustration kit: a tall glossy
    shield with a padlock, ringed by floating "Encrypted / No Cloud / Offline OK"
    pills. That reads as clip art and says nothing the caption beside it does not
    already say. A file window is specific, is literally what the claim means,
    and works on all eight pages that use this file.
  -->
  <defs>
    <linearGradient id="plsBg" x1="0" y1="0" x2="600" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f7f9fc"/>
      <stop offset="100%" stop-color="#eef2f8"/>
    </linearGradient>
    <filter id="plsShadow" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
    <clipPath id="plsWin">
      <rect x="46" y="60" width="508" height="380" rx="14"/>
    </clipPath>
  </defs>

  <rect width="600" height="500" rx="24" fill="url(#plsBg)"/>

  <!-- faint desk grid -->
  <g opacity="0.5" stroke="#dbe3ee" stroke-width="1">
    <line x1="0" y1="125" x2="600" y2="125"/>
    <line x1="0" y1="250" x2="600" y2="250"/>
    <line x1="0" y1="375" x2="600" y2="375"/>
    <line x1="150" y1="0" x2="150" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="450" y1="0" x2="450" y2="500"/>
  </g>

  <!-- ===== the window ===== -->
  <g filter="url(#plsShadow)">
    <rect x="46" y="60" width="508" height="380" rx="14" fill="#ffffff"/>
  </g>

  <g clip-path="url(#plsWin)">
    <!-- title bar -->
    <rect x="46" y="60" width="508" height="46" fill="#fbfcfe"/>
    <line x1="46" y1="106" x2="554" y2="106" stroke="#e6ebf3" stroke-width="1"/>

    <!-- drive glyph -->
    <rect x="68" y="75" width="17" height="16" rx="3" fill="none" stroke="#3f63e8" stroke-width="1.6"/>
    <line x1="68" y1="84" x2="85" y2="84" stroke="#3f63e8" stroke-width="1.6"/>
    <circle cx="80.5" cy="87.5" r="1.4" fill="#3f63e8"/>

    <!-- breadcrumb: a local path, not a URL -->
    <text x="95" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Local Disk (C:)</text>
    <path d="M180 78l4 5-4 5" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="193" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#64748b">Documents</text>
    <path d="M269 78l4 5-4 5" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="282" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Argo Books</text>

    <!-- sidebar -->
    <rect x="46" y="106" width="140" height="334" fill="#fafbfd"/>
    <line x1="186" y1="106" x2="186" y2="440" stroke="#e6ebf3" stroke-width="1"/>

    <text x="68" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.09em" fill="#94a3b8">THIS PC</text>

    <rect x="58" y="148" width="118" height="30" rx="7" fill="#eef2fe"/>
    <rect x="70" y="158" width="14" height="11" rx="2.5" fill="none" stroke="#3f63e8" stroke-width="1.5"/>
    <line x1="70" y1="164" x2="84" y2="164" stroke="#3f63e8" stroke-width="1.5"/>
    <text x="92" y="167" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#3f63e8">Local Disk (C:)</text>

    <path d="M70 192h5.5l1.8 2.4H84a1.6 1.6 0 0 1 1.6 1.6v6.4A1.6 1.6 0 0 1 84 204H70a1.6 1.6 0 0 1-1.6-1.6v-9A1.6 1.6 0 0 1 70 192z" fill="#cbd5e1"/>
    <text x="92" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#64748b">Documents</text>

    <path d="M70 224h5.5l1.8 2.4H84a1.6 1.6 0 0 1 1.6 1.6v6.4A1.6 1.6 0 0 1 84 236H70a1.6 1.6 0 0 1-1.6-1.6v-9A1.6 1.6 0 0 1 70 224z" fill="#cbd5e1"/>
    <text x="92" y="234" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#64748b">Downloads</text>

    <!-- column headers -->
    <text x="212" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.09em" fill="#94a3b8">NAME</text>
    <text x="452" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.09em" fill="#94a3b8" text-anchor="end">SIZE</text>
    <text x="534" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.09em" fill="#94a3b8" text-anchor="end">MODIFIED</text>
    <line x1="206" y1="150" x2="534" y2="150" stroke="#eef2f7" stroke-width="1"/>

    <!-- row 1 -->
    <path d="M212 167h8l2.6 3.4h11.4a2.3 2.3 0 0 1 2.3 2.3v9.6a2.3 2.3 0 0 1-2.3 2.3H212a2.3 2.3 0 0 1-2.3-2.3v-13a2.3 2.3 0 0 1 2.3-2.3z" fill="#3f63e8" opacity="0.85"/>
    <text x="246" y="183" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Receipts</text>
    <text x="452" y="183" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#94a3b8" text-anchor="end">342 files</text>
    <text x="534" y="183" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#64748b" text-anchor="end">Mar 14, 2026</text>
    <line x1="206" y1="199" x2="534" y2="199" stroke="#f1f5f9" stroke-width="1"/>

    <!-- row 2 -->
    <path d="M212 216h8l2.6 3.4h11.4a2.3 2.3 0 0 1 2.3 2.3v9.6a2.3 2.3 0 0 1-2.3 2.3H212a2.3 2.3 0 0 1-2.3-2.3v-13a2.3 2.3 0 0 1 2.3-2.3z" fill="#3f63e8" opacity="0.85"/>
    <text x="246" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">Invoices</text>
    <text x="452" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#94a3b8" text-anchor="end">118 files</text>
    <text x="534" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#64748b" text-anchor="end">Mar 12, 2026</text>
    <line x1="206" y1="248" x2="534" y2="248" stroke="#f1f5f9" stroke-width="1"/>

    <!-- row 3: the database -->
    <ellipse cx="221" cy="267" rx="10" ry="3.6" fill="none" stroke="#64748b" stroke-width="1.6"/>
    <path d="M211 267v11c0 2 4.5 3.6 10 3.6s10-1.6 10-3.6v-11" fill="none" stroke="#64748b" stroke-width="1.6"/>
    <path d="M211 273c0 2 4.5 3.6 10 3.6s10-1.6 10-3.6" fill="none" stroke="#64748b" stroke-width="1.6"/>
    <text x="246" y="281" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">argo-books.db</text>
    <text x="452" y="281" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#64748b" text-anchor="end">24.8 MB</text>
    <text x="534" y="281" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#64748b" text-anchor="end">Mar 14, 2026</text>
    <line x1="206" y1="297" x2="534" y2="297" stroke="#f1f5f9" stroke-width="1"/>

    <!-- row 4: a backup -->
    <path d="M213 313h11l7 6.5v14a2 2 0 0 1-2 2h-16a2 2 0 0 1-2-2v-18.5a2 2 0 0 1 2-2z" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M224 313v6.5h7" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="246" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1e293b">backup-2026-03.zip</text>
    <text x="452" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#64748b" text-anchor="end">8.4 MB</text>
    <text x="534" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#64748b" text-anchor="end">Mar 01, 2026</text>

    <!-- status bar carries the claim, inside the fiction of a real window -->
    <line x1="46" y1="398" x2="554" y2="398" stroke="#e6ebf3" stroke-width="1"/>
    <rect x="46" y="398" width="508" height="42" fill="#fbfcfe"/>
    <circle cx="212" cy="419" r="7.5" fill="#dcfce7"/>
    <path d="M208.6 419.2l2.4 2.4 4.5-4.8" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="229" y="423" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">4 items &#183; 33.2 MB &#183; stored on this computer</text>
  </g>

  <rect x="46" y="60" width="508" height="380" rx="14" fill="none" stroke="#e2e8f0" stroke-width="1"/>
</svg>
