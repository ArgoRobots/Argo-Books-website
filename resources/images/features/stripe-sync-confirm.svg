<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <defs>
    <linearGradient id="sscBg" x1="0" y1="0" x2="600" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="sscShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <filter id="sscDialogShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="500" rx="24" fill="url(#sscBg)"/>

  <!-- Subtle grid -->
  <g opacity="0.03" stroke="#3b82f6" stroke-width="1">
    <line x1="0" y1="100" x2="600" y2="100"/><line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="300" x2="600" y2="300"/><line x1="0" y1="400" x2="600" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="500"/><line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/><line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
  </g>
  <circle cx="540" cy="70" r="45" fill="#635bff" opacity="0.05"/>
  <circle cx="60" cy="430" r="35" fill="#16a34a" opacity="0.04"/>

  <!-- App panel -->
  <g filter="url(#sscShadow)">
    <rect x="32" y="24" width="536" height="452" rx="16" fill="white"/>
  </g>

  <!-- Header -->
  <circle cx="66" cy="56" r="18" fill="#eff6ff"/>
  <g stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="59" y1="62" x2="59" y2="55"/>
    <line x1="66" y1="62" x2="66" y2="50"/>
    <line x1="73" y1="62" x2="73" y2="53"/>
  </g>
  <text x="96" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#1e293b">Revenue</text>
  <text x="96" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">10 new charges found in Stripe</text>

  <!-- Read-only key reassurance chip -->
  <rect x="436" y="45" width="108" height="22" rx="11" fill="#ecfdf5"/>
  <g stroke="#16a34a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="449" y="55" width="9" height="7" rx="1.5"/>
    <path d="M451 55v-2a2.5 2.5 0 0 1 5 0v2"/>
  </g>
  <text x="464" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#16a34a" dominant-baseline="central">Read-only key</text>

  <line x1="32" y1="88" x2="568" y2="88" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Stripe ready-to-sync banner (as it appears on the Revenue page) -->
  <rect x="56" y="102" width="488" height="44" rx="8" fill="#f8fafc" stroke="#3f63e8" stroke-width="1"/>
  <g stroke="#3f63e8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M79 116v9"/>
    <polyline points="75,121 79,125 83,121"/>
    <path d="M72 130h14"/>
  </g>
  <text x="96" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" dominant-baseline="central">Stripe: new sales are ready to sync.</text>
  <rect x="398" y="112" width="68" height="24" rx="6" fill="#3f63e8"/>
  <text x="432" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="white" text-anchor="middle" dominant-baseline="central">Sync now</text>
  <rect x="474" y="112" width="58" height="24" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <text x="503" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#475569" text-anchor="middle" dominant-baseline="central">Dismiss</text>

  <!-- Table header -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#94a3b8" letter-spacing="0.5">
    <text x="72" y="166" dominant-baseline="central">PRODUCT</text>
    <text x="240" y="166" dominant-baseline="central">CUSTOMER</text>
    <text x="430" y="166" text-anchor="end" dominant-baseline="central">AMOUNT</text>
    <text x="505" y="166" text-anchor="middle" dominant-baseline="central">SOURCE</text>
  </g>
  <line x1="56" y1="176" x2="544" y2="176" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Rows -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="56" y="186" width="488" height="28" rx="6" fill="#f8fafc"/>
    <text x="72" y="200" font-size="11.5" font-weight="500" fill="#1e293b" dominant-baseline="central">Pro plan, monthly</text>
    <text x="240" y="200" font-size="11.5" fill="#475569" dominant-baseline="central">Maya Chen</text>
    <text x="430" y="200" font-size="11.5" font-weight="600" fill="#10b981" text-anchor="end" dominant-baseline="central">$49.00</text>
    <rect x="478" y="192" width="54" height="16" rx="8" fill="#efeeff"/>
    <text x="505" y="200" font-size="8.5" font-weight="600" fill="#635bff" text-anchor="middle" dominant-baseline="central">via Stripe</text>

    <text x="72" y="234" font-size="11.5" font-weight="500" fill="#1e293b" dominant-baseline="central">Pro plan, annual</text>
    <text x="240" y="234" font-size="11.5" fill="#475569" dominant-baseline="central">Devon Okafor</text>
    <text x="430" y="234" font-size="11.5" font-weight="600" fill="#10b981" text-anchor="end" dominant-baseline="central">$490.00</text>
    <rect x="478" y="226" width="54" height="16" rx="8" fill="#efeeff"/>
    <text x="505" y="234" font-size="8.5" font-weight="600" fill="#635bff" text-anchor="middle" dominant-baseline="central">via Stripe</text>

    <rect x="56" y="254" width="488" height="28" rx="6" fill="#f8fafc"/>
    <text x="72" y="268" font-size="11.5" font-weight="500" fill="#1e293b" dominant-baseline="central">Team plan, monthly</text>
    <text x="240" y="268" font-size="11.5" fill="#475569" dominant-baseline="central">Priya Raman</text>
    <text x="430" y="268" font-size="11.5" font-weight="600" fill="#10b981" text-anchor="end" dominant-baseline="central">$149.00</text>
    <rect x="478" y="260" width="54" height="16" rx="8" fill="#efeeff"/>
    <text x="505" y="268" font-size="8.5" font-weight="600" fill="#635bff" text-anchor="middle" dominant-baseline="central">via Stripe</text>

    <text x="72" y="302" font-size="11.5" font-weight="500" fill="#1e293b" dominant-baseline="central">Starter plan, monthly</text>
    <text x="240" y="302" font-size="11.5" fill="#475569" dominant-baseline="central">Sam Ellis</text>
    <text x="430" y="302" font-size="11.5" font-weight="600" fill="#10b981" text-anchor="end" dominant-baseline="central">$19.00</text>
    <rect x="478" y="294" width="54" height="16" rx="8" fill="#efeeff"/>
    <text x="505" y="302" font-size="8.5" font-weight="600" fill="#635bff" text-anchor="middle" dominant-baseline="central">via Stripe</text>
  </g>

  <!-- Linked-fee note -->
  <g stroke="#16a34a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="72,325 75,328 80,321"/>
  </g>
  <text x="88" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#64748b" dominant-baseline="central">10 processing fees recorded as linked expenses</text>

  <!-- Confirmation dialog: nothing imports until this is accepted -->
  <g filter="url(#sscDialogShadow)">
    <rect x="124" y="342" width="352" height="118" rx="14" fill="white"/>
  </g>
  <rect x="124" y="342" width="352" height="118" rx="14" fill="white" stroke="#e8edf5" stroke-width="1"/>
  <text x="148" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#1e293b" dominant-baseline="central">Import from Stripe</text>
  <text x="148" y="392" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" dominant-baseline="central">Import your Stripe activity: $4,820.00 in sales</text>
  <text x="148" y="408" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" dominant-baseline="central">and $142.78 in fees?</text>
  <rect x="296" y="422" width="68" height="26" rx="7" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <text x="330" y="435" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#475569" text-anchor="middle" dominant-baseline="central">Cancel</text>
  <rect x="374" y="422" width="78" height="26" rx="7" fill="#3f63e8"/>
  <text x="413" y="435" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="white" text-anchor="middle" dominant-baseline="central">Import</text>
</svg>
