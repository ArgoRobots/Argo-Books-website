<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <defs>
    <linearGradient id="pdBg" x1="0" y1="0" x2="600" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="pdShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="600" height="500" rx="24" fill="url(#pdBg)"/>
  <g opacity="0.03" stroke="#3b82f6" stroke-width="1">
    <line x1="0" y1="100" x2="600" y2="100"/><line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="300" x2="600" y2="300"/><line x1="0" y1="400" x2="600" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="500"/><line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/><line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
  </g>
  <circle cx="540" cy="70" r="45" fill="#16a34a" opacity="0.04"/>
  <circle cx="60" cy="430" r="35" fill="#3b82f6" opacity="0.04"/>

  <g filter="url(#pdShadow)">
    <rect x="32" y="24" width="536" height="452" rx="16" fill="white"/>
  </g>

  <!-- Header -->
  <circle cx="66" cy="56" r="18" fill="#eff6ff"/>
  <g stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="63" cy="52" r="4"/>
    <path d="M56 64c0-4 3.2-6.5 7-6.5s7 2.5 7 6.5"/>
    <path d="M71 51.5a3.4 3.4 0 0 1 0 6.4"/>
    <path d="M73 63.5c0-2.6-1-4.4-2.6-5.4"/>
  </g>
  <text x="92" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#1e293b">Pay Stub</text>
  <text x="92" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">D. Okafor &#183; Aug 3 to Aug 16, 2026</text>

  <rect x="452" y="42" width="100" height="26" rx="13" fill="#f1f5f9"/>
  <text x="502" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle" dominant-baseline="central">Biweekly &#183; ON</text>

  <line x1="48" y1="88" x2="552" y2="88" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Earnings -->
  <text x="48" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="0.06em" fill="#94a3b8">EARNINGS</text>

  <g font-family="system-ui, -apple-system, sans-serif" font-size="12.5">
    <text x="48" y="138" fill="#475569">Regular pay</text>
    <text x="552" y="138" fill="#1e293b" font-weight="600" text-anchor="end">2,400.00</text>
    <text x="48" y="164" fill="#1e293b" font-weight="700">Gross pay</text>
    <text x="552" y="164" fill="#1e293b" font-weight="700" text-anchor="end">2,400.00</text>
  </g>

  <line x1="48" y1="182" x2="552" y2="182" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Deductions -->
  <text x="48" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="0.06em" fill="#94a3b8">DEDUCTIONS</text>

  <g font-family="system-ui, -apple-system, sans-serif" font-size="12.5">
    <text x="48" y="232" fill="#475569">Canada Pension Plan</text>
    <text x="552" y="232" fill="#1e293b" font-weight="600" text-anchor="end">134.79</text>
    <text x="48" y="256" fill="#475569">Employment Insurance</text>
    <text x="552" y="256" fill="#1e293b" font-weight="600" text-anchor="end">39.12</text>
    <text x="48" y="280" fill="#475569">Federal income tax</text>
    <text x="552" y="280" fill="#1e293b" font-weight="600" text-anchor="end">268.90</text>
    <text x="48" y="304" fill="#475569">Ontario income tax</text>
    <text x="552" y="304" fill="#1e293b" font-weight="600" text-anchor="end">152.45</text>
  </g>

  <line x1="48" y1="320" x2="552" y2="320" stroke="#e2e8f0" stroke-width="1"/>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="12.5">
    <text x="48" y="342" fill="#1e293b" font-weight="700">Total deductions</text>
    <text x="552" y="342" fill="#b91c1c" font-weight="700" text-anchor="end">595.26</text>
  </g>

  <!-- Net pay -->
  <rect x="48" y="358" width="504" height="62" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="72" y="389" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#166534" dominant-baseline="central">Net pay</text>
  <text x="528" y="389" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#16a34a" text-anchor="end" dominant-baseline="central">$1,804.74</text>

  <!-- Which table the figures came from -->
  <rect x="48" y="434" width="228" height="26" rx="13" fill="#eff6ff"/>
  <circle cx="66" cy="447" r="7" fill="#3b82f6"/>
  <path d="M62.6 447l2.4 2.4 4.4-4.4" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="80" y="447" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#1d4ed8" dominant-baseline="central">CRA payroll tables &#183; July 2026</text>
